# Campaign C1 KV contract. A run whose observed pool geometry differs from its profile aborts.
# bytes_per_block = 2 (K and V) x num_layers x block_size x num_kv_heads x head_dim x element_bytes

[contract]
campaign_id = "c1"
spec_version = 1
dtype = "Bf16"
element_bytes = 2
block_size = 16

[profiles.tinyllama]
gates = ["1"]
num_layers = 22
num_kv_heads = 4
head_dim = 64
bytes_per_token = 22528
bytes_per_block = 360448
num_blocks = 4096
pool_bytes = 1476395008            # 1.375 GiB

[profiles.qwen3_coder_30b_a3b_fp8]
gates = ["1.5", "2", "3", "4"]
num_layers = 48
num_kv_heads = 4
head_dim = 128
bytes_per_token = 98304             # 96 KiB
bytes_per_block = 1572864           # 1.5 MiB
num_blocks = 27306
pool_bytes = 42948624384            # 27306 x 1.5 MiB, just under 40 GiB
# Reference sizing (not enforced):
# 32K parent + 500 x 512 private tokens  ~ 18,048 blocks (Gate 3 stage D fits)
# 32K parent + 500 x 1000 private tokens ~ 33,548 blocks (Gate 4 oversubscription exceeds pool)
