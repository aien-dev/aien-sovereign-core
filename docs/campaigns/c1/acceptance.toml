# Campaign C1 acceptance criteria. Frozen on merge. Changes only by amendment (SPEC.md Section 14).

[campaign]
id = "c1"
spec_version = 1

[correctness]
# Correctness invariants are binary: every required trial passes.
required_pass_fraction = 1.0
# KV bytes outside legitimately COW-mutated pages must be byte-identical.
unmodified_kv_byte_tolerance = 0
max_leaked_blocks = 0
max_duplicate_live_sequence_ids = 0
max_stale_id_reuse = 0
max_disallowed_placement_events = 0
max_nan_or_inf_logits = 0
max_lost_completions = 0
max_scheduler_deadlocks = 0

[numerics]
# Tolerance for each metric = noise_multiplier_k x measured noise floor (SPEC.md Section 5.3).
noise_multiplier_k = 2.0
# Denominator floor for relative error: |a - b| / max(|ref|, relative_error_epsilon).
relative_error_epsilon = 1.0e-3
# Top-1 disagreement is allowed only where the reference top-2 margin is below the absolute tolerance.
top1_margin_exemption = "reference_top2_margin_below_abs_tolerance"
compare_every_generated_step = true

# Measured noise floors. Filled by amendment before the equivalence runs they govern.
# A run whose governing floor is "unmeasured" cannot produce a PASS for I3.
[numerics.noise_floor.tinyllama]
status = "unmeasured"

[numerics.noise_floor.qwen3_coder_30b_a3b_fp8]
status = "unmeasured"

[sampling]
gates_1_to_3 = ["greedy", "seeded"]
seeded_temperature = 0.7
seeded_top_p = 0.95
sampler = "philox4x32_10"
# Gate 4 continuity: seeded runs must produce identical token IDs.
gate4_token_identity_required = true

[fork_positions]
# Positions are 1, bs-1, bs, bs+1, k*bs-1, k*bs, k*bs+1 (bs = block_size from kv_contract.toml).
small = ["1", "bs-1", "bs", "bs+1"]
large = ["k*bs-1", "k*bs", "k*bs+1"]
write_orders = ["parent_first", "child_first", "parent_then_child", "child_then_parent"]

[fork_positions.k]
tinyllama = 64                   # 1024 tokens with bs = 16
qwen3_coder_30b_a3b_fp8 = 2000   # 32000 tokens with bs = 16

# Stages. Correctness invariants are identical at every stage; only these parameters change.

[[gate1.stage]]
name = "A"
parent_context_tokens = 64
branches = 2
trials = 10

[[gate1.stage]]
name = "B"
parent_context_tokens = 2048     # TinyLlama maximum context
branches = 32
trials = 100

[[gate1.stage]]
name = "adversarial_fork100"
parent_context_tokens = 1024
branches = 100
trials = 10
script = "fork100_mutate73_destroy20_advance_parent_mutate4_destroy73"

[[gate2.stage]]
name = "A"
parent_context_tokens = 64
branches = 2
trials = 10

[[gate2.stage]]
name = "B"
parent_context_tokens = 4096
branches = 8
trials = 10

[[gate2.stage]]
name = "C"
parent_context_tokens = 4096
branches = 32
trials = 100

[[gate3.stage]]
name = "C"
parent_context_tokens = 16384
branches = 100
max_private_tokens_per_branch = 512
divergence = "mixed"
trials = 10

[[gate3.stage]]
name = "D"
parent_context_tokens = 32768
branches = 500
max_private_tokens_per_branch = 512
divergence = "mixed"
trials = 3

[gate3]
preemption = false
watermark_blocks = 0
uninstrumented_repeat_required = true

[gate4]
preemption = true
oversubscription_branches = 500
oversubscription_private_tokens_per_branch = 1000
parent_context_tokens = 32768
fault_points = [
    "cow_copy_mid",
    "fork_mid",
    "release_mid",
    "step_pre_commit",
    "step_post_commit_pre_expose",
]
release_races = [
    "cancel_twice",
    "completion_vs_cancel",
    "preemption_vs_cancel",
    "parent_teardown_vs_child_cancel",
]
restart_same_fingerprint = true
restart_mismatched_fingerprint_must_refuse = true
