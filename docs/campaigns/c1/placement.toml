# Campaign C1 device placement contract. Enforced per op call via AIEN_ENFORCE_PLACEMENT.
# Op names match the backend trait methods in aien-inference-abi.
# A call whose observed execution is not in `allowed` aborts the run.
# `kernels` are glob patterns the external device witness must observe inside the op's NVTX range.
# Patterns marked PENDING are frozen by amendment from the Gate 0 qualification trace
# (cuBLAS kernel names are internal and bound to the frozen library digest).

[placement]
campaign_id = "c1"
spec_version = 1
policy = "hybrid"

[ops.rmsnorm]
allowed = ["cpu"]

[ops.apply_rope]
allowed = ["cpu"]

[ops.swiglu]
allowed = ["cpu"]

[ops.gqa_attention]
allowed = ["cpu"]

[ops.matmul_vec]
allowed = ["gb10"]
kernels = ["PENDING_GATE0_CUBLAS_GEMV"]

[ops.matmul_batch]
allowed = ["gb10"]
kernels = ["PENDING_GATE0_CUBLAS_GEMM"]

[ops.paged_attention]
# Single-sequence path delegates to paged_attention_batch.
allowed = ["gb10"]
kernels = ["*paged_attention_bf16*"]

[ops.paged_attention_batch]
allowed = ["gb10"]
kernels = ["*paged_attention_bf16*"]

[ops.compute_logits]
allowed = ["gb10"]
kernels = ["PENDING_GATE0_CUBLAS_GEMV"]
