name: CRB1 conformance

# Migration seam 1: the Rust reference reader (crates/crumbs) must pass the
# shared CRB1 corpus in aien-protocols specs/crumb-visible with zero
# differences. The corpus is pinned by commit; bump the pin when the
# contract corpus changes.

"on":
  push:
    branches: [main]
    paths:
      - "crates/crumbs/**"
      - ".github/workflows/crumb-visible-conformance.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/crumbs/**"
      - ".github/workflows/crumb-visible-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crb1-rust:
    name: CRB1 conformance (impl=rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Checkout pinned CRB1 contract corpus
        uses: actions/checkout@v4
        with:
          repository: aien-dev/aien-protocols
          ref: b50c00d737fa5c57ea7280e2aa4b0354ff166cf5
          path: crb1-protocols

      - name: Setup Sibling Dependencies
        run: |
          mkdir -p ../aien-protocols
          cp -r crb1-protocols/* ../aien-protocols/

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run shared corpus through the Rust reader
        env:
          CRB1_VECTORS: ${{ github.workspace }}/crb1-protocols/specs/crumb-visible/vectors
          CRB1_REQUIRE: "1"
        run: cargo test -p crumbs --test visible_conformance -- --nocapture
