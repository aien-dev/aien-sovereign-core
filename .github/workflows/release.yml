name: Multi-OS Cross-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sovereign-linux-x86_64.tar.gz
            use_tar: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sovereign-macos-arm64.tar.gz
            use_tar: true

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Checkout pinned protocols
        uses: actions/checkout@v4
        with:
          repository: aien-dev/aien-protocols
          ref: 7ac6facb630ca7e9a6ab4125b292203fe2bb6687
          path: protocols-checkout

      - name: Place sibling dependency
        run: mv protocols-checkout ../aien-protocols

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Workspace
        run: cargo build --locked --release --workspace

      - name: Package Release Assets
        run: bash scripts/package-release.sh "${{ matrix.artifact_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish Release and Checksums
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum sovereign-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v0.1.0"
          fi

          NOTES_FILE="RELEASE_NOTES.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "# AIEN Sovereign Core ${TAG}" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "Official release of the AIEN Sovereign Native Systems Architecture." >> "$NOTES_FILE"
          fi

          cd release-artifacts
          gh release create "$TAG" sovereign-* SHA256SUMS.txt \
            --title "AIEN Sovereign Core ${TAG}" \
            --notes-file ../"$NOTES_FILE" \
            --draft=false \
            --prerelease=false || \
          gh release upload "$TAG" sovereign-* SHA256SUMS.txt --clobber
