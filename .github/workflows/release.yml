name: Multi-OS Cross-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sovereign-linux-x86_64.tar.gz
            use_tar: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: sovereign-linux-aarch64.tar.gz
            use_tar: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sovereign-macos-arm64.tar.gz
            use_tar: true

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Workspace
        run: cargo build --locked --release --workspace

      - name: Package Release Assets
        run: bash scripts/package-release.sh "${{ matrix.artifact_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish Release and Checksums
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum sovereign-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign Checksums (when the release key secret is configured)
        working-directory: release-artifacts
        env:
          AIEN_RELEASE_SIGNING_KEY: ${{ secrets.AIEN_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$AIEN_RELEASE_SIGNING_KEY" ]; then
            echo "No signing key secret; release will carry checksums only. Sign by hand per docs/release/RELEASE_SIGNING.md and upload SHA256SUMS.txt.sig."
            exit 0
          fi
          umask 077
          printf "%s\n" "$AIEN_RELEASE_SIGNING_KEY" > ../release_key
          ssh-keygen -Y sign -f ../release_key -n aien-release SHA256SUMS.txt
          rm -f ../release_key
          ssh-keygen -Y verify -f ../docs/release/allowed_signers -I aien-release -n aien-release -s SHA256SUMS.txt.sig < SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v0.1.0"
          fi

          NOTES_FILE="RELEASE_NOTES.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "# AIEN Sovereign Core ${TAG}" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "Official release of the AIEN Sovereign Native Systems Architecture." >> "$NOTES_FILE"
          fi

          cd release-artifacts
          SIG=""
          [ ! -f SHA256SUMS.txt.sig ] || SIG="SHA256SUMS.txt.sig"
          gh release create "$TAG" sovereign-* SHA256SUMS.txt $SIG \
            --title "AIEN Sovereign Core ${TAG}" \
            --notes-file ../"$NOTES_FILE" \
            --draft=false \
            --prerelease=false || \
          gh release upload "$TAG" sovereign-* SHA256SUMS.txt $SIG --clobber
