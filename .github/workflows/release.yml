name: Multi-OS Cross-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sovereign-linux-x86_64.tar.gz
            use_tar: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: sovereign-linux-aarch64.tar.gz
            use_tar: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sovereign-macos-arm64.tar.gz
            use_tar: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sovereign-windows-x64.zip
            use_tar: false

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Workspace
        run: cargo build --release --workspace

      - name: Package Release Assets (Unix)
        if: matrix.use_tar
        run: |
          mkdir -p dist/bin dist/imprints
          cp target/release/aien dist/bin/ 2>/dev/null || true
          cp target/release/spark-cockpit-rs dist/bin/ 2>/dev/null || true
          cp target/release/spark-inquisitor dist/bin/ 2>/dev/null || true
          cp target/release/cortex-encoder-rs dist/bin/ 2>/dev/null || true
          cp target/release/cortex-rs dist/bin/ 2>/dev/null || true
          cp target/release/spark-supervisor dist/bin/ 2>/dev/null || true
          cp target/release/spark-debugger dist/bin/ 2>/dev/null || true
          cp target/release/bench_inference_stack dist/bin/ 2>/dev/null || true
          cp -r imprints/en2-trinity dist/imprints/ 2>/dev/null || true
          cp CONSTITUTION.md README.md install.sh dist/ 2>/dev/null || true
          tar -czvf ${{ matrix.artifact_name }} -C dist .

      - name: Package Release Assets (Windows)
        if: "!matrix.use_tar"
        run: |
          New-Item -ItemType Directory -Force -Path dist/bin, dist/imprints
          Get-ChildItem target/release/*.exe | ForEach-Object { Copy-Item $_.FullName dist/bin/ }
          if (Test-Path imprints/en2-trinity) { Copy-Item -Recurse -Force imprints/en2-trinity dist/imprints/ }
          if (Test-Path CONSTITUTION.md) { Copy-Item CONSTITUTION.md dist/ }
          if (Test-Path README.md) { Copy-Item README.md dist/ }
          if (Test-Path install.ps1) { Copy-Item install.ps1 dist/ }
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish Release and Checksums
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, refs/tags/v) || github.event_name == workflow_dispatch
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum sovereign-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v0.1.0}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "${GITHUB_REF_NAME}" ]; then
            TAG_NAME="v0.1.0"
          fi

          NOTES_FILE="RELEASE_NOTES.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "# AIEN Sovereign Core ${TAG_NAME}" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "Official release of the AIEN Sovereign Native Systems Architecture." >> "$NOTES_FILE"
          fi

          cd release-artifacts
          gh release create "$TAG_NAME" sovereign-* SHA256SUMS.txt \
            --title "AIEN Sovereign Core ${TAG_NAME}" \
            --notes-file ../"$NOTES_FILE" \
            --draft=false \
            --prerelease=false || \
          gh release upload "$TAG_NAME" sovereign-* SHA256SUMS.txt --clobber
