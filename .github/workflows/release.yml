name: Multi-OS Cross-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build, package, sign with a throwaway key, verify, upload workflow artifacts only. Never creates a release."
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sovereign-linux-x86_64.tar.gz
            use_tar: true
            native_engine: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: sovereign-linux-aarch64.tar.gz
            use_tar: true
            native_engine: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sovereign-macos-arm64.tar.gz
            use_tar: true
            native_engine: false

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: GNU tar (reproducible packages need it)
        if: runner.os == 'macOS'
        run: brew install gnu-tar

      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustc --version

      - name: Release gate (candidate named, omega.lock and Cargo.lock pins equal the candidate's)
        id: gate
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: scripts/check-release-candidate.sh

      - name: Read pins (omega.lock, then omega physics.lock)
        id: pins
        run: echo "omega=$(tr -d '[:space:]' < omega.lock)" >> "$GITHUB_OUTPUT"

      # The native engine is linked only on the candidate target (linux aarch64, the GB10 host class).
      # Other targets build the CPU stub, are labelled as such in the release notes, and are not the candidate.
      - name: Checkout omega at omega.lock
        if: matrix.native_engine
        uses: actions/checkout@v4
        with:
          repository: aien-dev/omega
          ref: ${{ steps.pins.outputs.omega }}
          path: omega

      - name: Read physics pin and checkout physics
        if: matrix.native_engine
        id: physpin
        run: echo "physics=$(tr -d '[:space:]' < omega/physics.lock)" >> "$GITHUB_OUTPUT"

      - name: Checkout physics at omega's physics.lock
        if: matrix.native_engine
        uses: actions/checkout@v4
        with:
          repository: aien-dev/physics
          ref: ${{ steps.physpin.outputs.physics }}
          path: physics

      - name: Build the candidate way (scripts/repro-build.sh, fresh CARGO_HOME, no mojo)
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-home
        run: |
          if command -v mojo >/dev/null 2>&1; then echo "mojo is on PATH; the candidate build runs without it" >&2; exit 1; fi
          if [ "${{ matrix.native_engine }}" = "true" ]; then
            export AIEN_OMEGA_DIR="$GITHUB_WORKSPACE/omega" AIEN_PHYSICS_DIR="$GITHUB_WORKSPACE/physics"
          fi
          rm -rf "$CARGO_HOME"
          cargo fetch --locked
          # The one recipe (docs/release/BUILD_RECIPE.md): helpers as one group, then aien-cli alone and last.
          scripts/release-build.sh

      - name: Package Release Assets (reproducible tarball, release.toml inside)
        env:
          AIEN_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: |
          bash scripts/package-release.sh "${{ matrix.artifact_name }}"
          AIEN_SHA="$(sha256sum target/release/aien-cli 2>/dev/null || shasum -a 256 target/release/aien-cli)"
          printf '%s  %s  native_engine=%s\n' "${AIEN_SHA%% *}" "${{ matrix.artifact_name }}" "${{ matrix.native_engine }}" > "aien-cli-sha256-${{ matrix.target }}.txt"
          cat "aien-cli-sha256-${{ matrix.target }}.txt"

      - name: Check the package against the candidate (model inputs, files, aien-cli digest; native build also the candidate digest)
        id: pkgcheck
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "${{ matrix.native_engine }}" = "true" ]; then NATIVE=--native; else NATIVE=; fi
          scripts/check-release-candidate.sh --package "${{ matrix.artifact_name }}" $NATIVE

      - name: Record dry-run status
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          {
            echo "DRY RUN. This is not a release and must not be installed as a candidate."
            echo "release gate: ${{ steps.gate.outcome }}"
            echo "package check: ${{ steps.pkgcheck.outcome }}"
          } > "DRY-RUN-STATUS-${{ matrix.target }}.txt"
          cat "DRY-RUN-STATUS-${{ matrix.target }}.txt"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.artifact_name }}
            aien-cli-sha256-${{ matrix.target }}.txt
            DRY-RUN-STATUS-${{ matrix.target }}.txt

  dry-run-sign:
    name: "Dry run: sign with a throwaway key and verify"
    needs: build-release
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Checksums, throwaway signature, verification
        working-directory: release-artifacts
        run: |
          cat aien-cli-sha256-*.txt > aien-cli-digests.txt
          sha256sum sovereign-* aien-cli-digests.txt > SHA256SUMS.txt
          ssh-keygen -q -t ed25519 -N "" -C aien-dry-run-throwaway -f ../dry_key
          printf "aien-release %s\n" "$(cut -d" " -f1,2 ../dry_key.pub)" > ../dry_signers
          ssh-keygen -Y sign -f ../dry_key -n aien-release SHA256SUMS.txt
          ../scripts/verify-release-assets.sh . ../dry_signers
          rm -f ../dry_key
          echo "DRY RUN: signed with a throwaway key generated in this job. Not the AIEN release key. Not a release." > DRY-RUN-NOT-A-RELEASE.txt

      - name: Upload dry-run artifacts (workflow artifacts only, no release)
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-signed-assets
          path: release-artifacts

  publish-release:
    name: Publish Release and Checksums
    needs: build-release
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          cat aien-cli-sha256-*.txt > aien-cli-digests.txt
          sha256sum sovereign-* aien-cli-digests.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign Checksums (fails the job when the release key secret is absent)
        working-directory: release-artifacts
        env:
          AIEN_RELEASE_SIGNING_KEY: ${{ secrets.AIEN_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$AIEN_RELEASE_SIGNING_KEY" ]; then
            echo "AIEN_RELEASE_SIGNING_KEY secret is not configured. Refusing to publish an unsigned release." >&2
            exit 1
          fi
          umask 077
          printf "%s\n" "$AIEN_RELEASE_SIGNING_KEY" > ../release_key
          ssh-keygen -Y sign -f ../release_key -n aien-release SHA256SUMS.txt
          rm -f ../release_key
          ../scripts/verify-release-assets.sh . ../docs/release/allowed_signers

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v0.1.0"
          fi

          NOTES_FILE="RELEASE_NOTES.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "# AIEN Sovereign Core ${TAG}" > "$NOTES_FILE"
            echo "" >> "$NOTES_FILE"
            echo "Official release of the AIEN Sovereign Native Systems Architecture." >> "$NOTES_FILE"
          fi

          {
            cat "$NOTES_FILE"
            echo
            echo "## aien-cli digests (compare with the candidate manifest [executables] aien-cli-native-release)"
            echo
            echo "Columns: sha256 of target/release/aien-cli, archive, whether the native engine (omega at omega.lock) is linked. Only the native_engine=true linux-aarch64 row is the candidate binary."
            echo
            echo '```'
            cat release-artifacts/aien-cli-digests.txt
            echo '```'
          } > release-notes-with-digests.md
          NOTES_FILE=release-notes-with-digests.md

          cd release-artifacts
          SIG=""
          [ -f SHA256SUMS.txt.sig ] || { echo "SHA256SUMS.txt.sig is missing; refusing to publish" >&2; exit 1; }
          SIG="SHA256SUMS.txt.sig"
          gh release create "$TAG" sovereign-* aien-cli-digests.txt SHA256SUMS.txt $SIG \
            --title "AIEN Sovereign Core ${TAG}" \
            --notes-file ../"$NOTES_FILE" \
            --draft=false \
            --prerelease=false || \
          gh release upload "$TAG" sovereign-* aien-cli-digests.txt SHA256SUMS.txt $SIG --clobber
