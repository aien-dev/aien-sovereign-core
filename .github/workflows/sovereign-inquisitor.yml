name: Sovereign Inquisitor Alignment Gate

on:
  pull_request_target:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  interview:
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sovereign Core
        uses: actions/checkout@v4

      - name: Build Sovereign Inquisitor
        run: cargo build --release -p spark-inquisitor

      - name: Generate Interview Comment
        id: interview
        run: |
          COMMENT=$(./target/release/spark-inquisitor interview --author "${{ github.event.pull_request.user.login }}" --pr "${{ github.event.pull_request.number }}" --title "${{ github.event.pull_request.title }}")
          echo "comment<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Interview Comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${{ steps.interview.outputs.comment }}`
            })
