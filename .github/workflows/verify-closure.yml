name: Verify Closure

"on":
  push:
    branches: [main]
    paths:
      - "crates/aien-closure/**"
      - "crates/aien-proof/**"
      - ".github/workflows/verify-closure.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/aien-closure/**"
      - "crates/aien-proof/**"
      - ".github/workflows/verify-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-closure:
    name: verify-closure build, tests, seeded fixture run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Checkout Sibling Protocols Dependency
        uses: actions/checkout@v4
        with:
          repository: aien-dev/aien-protocols
          ref: 7ac6facb630ca7e9a6ab4125b292203fe2bb6687
          path: aien-protocols

      - name: Setup Sibling Dependencies
        run: |
          mkdir -p ../aien-protocols
          cp -r aien-protocols/* ../aien-protocols/

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build verify-closure
        run: cargo build --locked -p aien-closure --bin verify-closure

      - name: Test aien-closure
        run: cargo test --locked -p aien-closure

      # The real repo has no closure.toml manifests yet (stage 6 adds them), so
      # this runs only against the seeded in-repo fixture and its receipt store.
      - name: Run verify-closure on the seeded fixture
        working-directory: crates/aien-closure/tests/fixtures/seeded
        run: |
          "$GITHUB_WORKSPACE/target/debug/verify-closure" --root . --store store
