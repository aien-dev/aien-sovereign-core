name: Hardening

# Lane L-E checks. Each check here comes with mutations that prove it catches
# a realistic fault (crates/aien-replay/mutations/). ci.yml is left alone.
#
# - kv-props: property tests on KV fork / append / free / rollback ownership,
#   then every kv.mutants mutation must make them fail.
# - trn1-rust: the Rust TRN1 reader must reproduce every line of the shared
#   corpus manifests, and switching off any one check must break that.
# - miri: aien-capability and aien-kv-cache unit + integration tests under
#   Miri (undefined-behaviour checker, nightly only), plus the KV property
#   tests at a low case count, then the Miri-only mutation must be caught.
#
# aien-replay is its own workspace root until the member-line PR lands, so it
# is built with --manifest-path.

"on":
  push:
    branches: [main]
    paths:
      - "crates/aien-replay/**"
      - "crates/aien-kv-cache/**"
      - "crates/aien-capability/**"
      - "crates/aien-platform/**"
      - "crates/aien-platform-linux/**"
      - ".github/workflows/hardening.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/aien-replay/**"
      - "crates/aien-kv-cache/**"
      - "crates/aien-capability/**"
      - "crates/aien-platform/**"
      - "crates/aien-platform-linux/**"
      - ".github/workflows/hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kv-props:
    name: KV ownership properties + mutants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch dependencies
        run: cargo fetch --manifest-path crates/aien-replay/Cargo.toml

      - name: KV ownership property tests
        run: cargo test --manifest-path crates/aien-replay/Cargo.toml --test kv_ownership_props

      - name: Every KV mutation must be caught
        run: sh crates/aien-replay/mutations/run_mutants.sh native

  miri:
    name: Miri (aien-capability, aien-kv-cache)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Nightly Rust Toolchain with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - name: Miri setup
        run: cargo miri setup

      - name: Miri on aien-capability
        run: cargo miri test -p aien-capability

      - name: Miri on aien-kv-cache
        run: cargo miri test -p aien-kv-cache

      - name: Miri on KV ownership property tests (8 cases)
        run: |
          cargo fetch --manifest-path crates/aien-replay/Cargo.toml
          cargo miri test --manifest-path crates/aien-replay/Cargo.toml --test kv_ownership_props

      - name: Miri-only mutation must be caught
        run: sh crates/aien-replay/mutations/run_mutants.sh miri

  trn1-rust:
    name: TRN1 conformance (impl=rust) + check mutants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # Pinned TRN1 corpus (aien-protocols, lane L-B). Bump the pin when the
      # contract corpus changes.
      - name: Checkout pinned TRN1 contract corpus
        uses: actions/checkout@v4
        with:
          repository: aien-dev/aien-protocols
          ref: 353b7d4be3f00169545caec1615cffa61f7d311a
          path: trn1-protocols

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run shared corpus through the Rust reader
        env:
          TRN1_VECTORS: ${{ github.workspace }}/trn1-protocols/specs/execution-transcript/vectors
          TRN1_REQUIRE: "1"
        run: cargo test --manifest-path crates/aien-replay/Cargo.toml --test trn1_conformance -- --nocapture

      - name: Every TRN1 check must be needed by the corpus
        env:
          TRN1_VECTORS: ${{ github.workspace }}/trn1-protocols/specs/execution-transcript/vectors
        run: sh crates/aien-replay/mutations/run_mutants.sh trn1
