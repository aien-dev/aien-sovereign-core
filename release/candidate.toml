# The candidate this tree is allowed to be released as. Read by scripts/check-release-candidate.sh
# (called from .github/workflows/release.yml and scripts/package-release.sh). A release fails
# unless omega.lock equals omega-commit below. Copied from aien-architecture
# qualification/candidates/CAND-3.toml ([commits] omega and [model]); change both together.
candidate = "CAND-3"
omega-commit = "f816473df391bc4fbcf99df722edd70ed26ebef1"
source-manifest = "aien-architecture qualification/candidates/CAND-3.toml"

[model]
