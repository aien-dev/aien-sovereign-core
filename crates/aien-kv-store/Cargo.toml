[package]
name = "aien-kv-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Persistent KV cache chunk identity, 256-byte record header codec, validation and the KvStore contract (ADR 0003)"

[dependencies]
aien-platform = { path = "../aien-platform", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
# geteuid and the O_NOFOLLOW / O_CLOEXEC open flags of the host adapter
# (unix only, needs std).
libc = { version = "0.2", optional = true }
# Encryption at rest of host objects (ADR 0003 section 19). std only: the
# sealing module lives beside the host filesystem adapter.
ring = { version = "0.17", optional = true }
zeroize = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["std"]
# The in-memory fake adapter needs std::sync::Mutex. Identity, codec and
# validation are no_std + alloc without this feature.
std = ["sha2/std", "dep:libc", "dep:ring", "dep:zeroize"]
