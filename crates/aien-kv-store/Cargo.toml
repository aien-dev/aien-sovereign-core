[package]
name = "aien-kv-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Persistent KV cache chunk identity, 256-byte record header codec, validation and the KvStore contract (ADR 0003)"

[dependencies]
aien-platform = { path = "../aien-platform", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["std"]
# The in-memory fake adapter needs std::sync::Mutex. Identity, codec and
# validation are no_std + alloc without this feature.
std = ["sha2/std"]
