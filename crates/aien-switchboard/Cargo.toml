[package]
name = "aien-switchboard"
description = "Switchboard core: accounts, jobs, usage gauges, operator rule table and one deterministic routing decision over our own AI accounts"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Pure by rule (ADR 0030): no network, no process spawning, no secrets in this
# crate. Real program adapters arrive in a later cut behind the Runner trait.
[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lib]
name = "aien_switchboard"
path = "src/lib.rs"
