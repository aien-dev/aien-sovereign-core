[package]
license = "Apache-2.0 WITH LLVM-exception"
name = "cortex-encoder-rs"
version = "0.1.0"
edition = "2021"
authors = ["AIEN Sovereign Systems & Contributors <sovereign@aien.dev>"]
description = "Native Rust and ONNX Runtime C-API embedding and reranking service for Cortex"

[dependencies]
axum = "0.7"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ort = { version = "2.0.0-rc.13", features = ["load-dynamic", "ndarray"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
clap = { version = "4.5", features = ["derive"] }
