[package]
name = "spark-harness"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <drake.aien@proton.me>"]
description = "Native Rust 5-layer change-management harness and MCP server for autonomous agents"
license.workspace = true

[dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spark-crumbs = { git = "https://github.com/aien-dev/spark-crumbs" }
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
crumb-spec = { git = "https://github.com/aien-dev/crumb-spec" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonschema = { version = "0.17", default-features = false }

[[bin]]
name = "spark-harness"
path = "src/main.rs"

[lib]
name = "spark_harness"
path = "src/lib.rs"
