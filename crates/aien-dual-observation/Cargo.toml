[package]
name = "aien-dual-observation"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "DUAL observation: read-only macroscopic snapshot of the serve path built from existing exact counters (ARCH-0031 DUAL-3a)"
license.workspace = true

[dependencies]
aien-abi-core = { path = "../aien-abi-core" }
aien-kv-cache = { path = "../aien-kv-cache" }
aien-scheduler = { path = "../aien-scheduler" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
aien-inference-abi = { path = "../aien-inference-abi" }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
