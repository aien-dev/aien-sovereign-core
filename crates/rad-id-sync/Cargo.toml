[package]
name = "rad-id-sync"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <drake.aien@proton.me>"]
description = "Identity & Key Synchronizer extension for Radicle sovereign git collaboration"
license.workspace = true

[lib]
name = "rad_id_sync"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rad-id-sync"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast", "zeroize"] }
rand = "0.8"
