[package]
name = "aien-trace"
description = "Correlation-only execution trace events: ids, bounded sinks and run reconstruction. Observational, never evidence or authorization."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "aien_trace"
path = "src/lib.rs"
