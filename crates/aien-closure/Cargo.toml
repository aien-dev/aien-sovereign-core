[package]
name = "aien-closure"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "verify-closure: CI bridge that checks every internal dependency has verified aien-proof evidence"

[dependencies]
aien-proof = { path = "../aien-proof" }
blake3 = "1.8"
serde_json = "1.0"

[lib]
name = "aien_closure"
path = "src/lib.rs"

[[bin]]
name = "verify-closure"
path = "src/main.rs"
