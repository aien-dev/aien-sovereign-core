[package]
name = "aien-omegese-constraint"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "The Omegese guardrail: a Constraint for the generation controller (ADR 0004 section 2.3) fed by the omegese next oracle"
license.workspace = true

# Nothing depends on this crate by default. A consumer (the door, an experiment harness) opts in
# with an optional dependency behind its own feature; the generation controller and the 30B never
# need it (Drake's guardrail decision (a), ADR 0004).

[dependencies]
aien-inference-abi = { path = "../aien-inference-abi" }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[dev-dependencies]
aien-inference-abi = { path = "../aien-inference-abi", features = ["host-test-engine"] }
