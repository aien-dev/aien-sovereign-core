[package]
name = "aien-kv-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Persistent KV benchmark harness (cut C9, sc#485): bench_persistent_kv on the host CPU reference backend, labelled rows, NOT_RUN rows"

# The harness drives the runtime spine (aien-runtime), which depends on
# aien-scheduler, so it cannot live in aien-scheduler/src/bin as CUTS.md C9
# first named (that would be a dependency cycle).

[dependencies]
aien-abi-core = { path = "../aien-abi-core" }
aien-inference-abi = { path = "../aien-inference-abi" }
aien-kv-store = { path = "../aien-kv-store" }
aien-runtime = { path = "../aien-runtime" }
aien-scheduler = { path = "../aien-scheduler" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.37", features = ["full"] }

[[bin]]
name = "bench_persistent_kv"
path = "src/bin/bench_persistent_kv.rs"
