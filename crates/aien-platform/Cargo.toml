[package]
name = "aien-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure no_std capability and compute platform ABI for the AIEN and SparkOS runtime"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }

[features]
default = ["alloc"]
alloc = []
serde = ["dep:serde"]

[dev-dependencies]
spin = "0.9"
