[package]
name = "spark-mail-rs"
version = "0.1.0"
edition = "2024"
authors = ["AIEN Sovereign Systems & Contributors <sovereign@aien.dev>"]
description = "Native Rust Sovereign Mail Server & Atlas Cortex Memory Bridge"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
axum = { version = "0.8.9" }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"

[[bin]]
name = "spark-mail"
path = "src/main.rs"

[lib]
name = "spark_mail"
path = "src/lib.rs"
