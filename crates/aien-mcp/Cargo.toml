[package]
name = "aien-mcp"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "MCP session manager. Discovery and speculative calls are separate from irreversible effect execution."

[dependencies]
aien-capability = { path = "../aien-capability" }
async-trait = "0.1"
rmcp = { version = "3.4.0", features = ["client", "server", "transport-async-rw"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.37", features = ["rt", "macros", "sync", "io-util"] }
