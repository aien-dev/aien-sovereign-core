[package]
name = "aien-allen-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "ALLEN persona profile v1: versioned, user-editable profile bound to the existing ALLEN identity (arch#159)"

[dependencies]
aien-allen = { path = "../aien-allen" }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# Test seam: lets a test stop the write sequence at a named step (simulated
# crash). Enabled only by the dev-dependency below, never by a daemon build.
fault-injection = []

[dev-dependencies]
tempfile = "3.10"
aien-allen-profile = { path = ".", features = ["fault-injection"] }
