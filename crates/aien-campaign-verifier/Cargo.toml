[package]
name = "aien-campaign-verifier"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Independent C1 campaign verifier: judges frozen evidence bundles against docs/campaigns/c1 without linking code under test"
license.workspace = true

# Independence rule (docs/campaigns/c1/SPEC.md Section 7): no dependency on any crate under test.
# tests/independence.rs enforces this.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
