[package]
name = "aien-inference-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Embedded model execution engine and weights loader"

[dependencies]
aien-inference-protocol = { path = "../aien-inference-protocol" }
aien-inference-abi = { path = "../aien-inference-abi" }
aien-kv-cache = { path = "../aien-kv-cache" }
aien-scheduler = { path = "../aien-scheduler" }
async-trait = "0.1"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
bytes = "1.6"
futures-util = "0.3"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
