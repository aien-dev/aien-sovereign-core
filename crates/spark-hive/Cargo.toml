[package]
name = "spark-hive"
version = "0.1.0"
edition = "2024"
authors = ["AIEN <aien.atlas@proton.me>"]
description = "Native Sovereign Honeycomb Hive Engine with Hexagonal Axial Geometry"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled", "bundled-full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0"
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.17"
