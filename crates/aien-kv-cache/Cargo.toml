[package]
name = "aien-kv-cache"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <aien@aienos.com>"]
description = "Native Paged KV-Cache Manager with physical unified-memory tensors and prefix caching"
license.workspace = true

[dependencies]
aien-platform = { path = "../aien-platform" }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
aien-platform-linux = { path = "../aien-platform-linux" }
