[package]
name = "cortex-path-m1"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Read-only experiment: deterministic claim-path scores for Cortex entity recall"
publish = false

[lib]
name = "cortex_path_m1"
path = "src/lib.rs"

[[bin]]
name = "cortex-path-m1"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
cortex-rs = { path = "../cortex-rs" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
