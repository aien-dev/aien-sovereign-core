[package]
license.workspace = true
name = "aien-cli"
version = "0.1.0"
edition = "2021"
authors = ["Drake Stapleton <drake.aien@proton.me>"]
description = "Sovereign Gemini-style Terminal CLI & Agent Harness for DGX Spark"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
colored = "2"
chrono = "0.4"
regex = "1"
crossterm = "0.27"
rustyline = "14"
async-trait = "0.1.92"
spark-hive = { path = "../spark-hive" }
aien-inference-abi = { path = "../aien-inference-abi" }
aien-kv-cache = { path = "../aien-kv-cache" }
aien-scheduler = { path = "../aien-scheduler" }
aien-runtime = { path = "../aien-runtime" }

[dev-dependencies]
tempfile = "3.10"

