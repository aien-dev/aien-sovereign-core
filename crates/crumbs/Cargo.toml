[package]
name = "crumbs"
description = "Crumbline: the Crumb v1 curriculum substrate for AIEN (visible/sealed contract, generators, mixer, verifier contract, trace corpus, promotion ladder, ledger)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Standalone by rule: no dependency on crumb-spec, spark-crumbs or any other
# workspace crate. Only ledger machinery: BLAKE3, UUID v7, serde.
[dependencies]
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "std", "serde"] }

[[bin]]
name = "crumbs"
path = "src/bin/crumbs.rs"

[[bin]]
name = "crumbs-probe-learner"
path = "src/bin/crumbs-probe-learner.rs"
