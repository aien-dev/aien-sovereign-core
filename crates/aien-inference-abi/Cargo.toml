[package]
name = "aien-inference-abi"
version = "0.1.0"
edition = "2021"
authors = ["AIEN Sovereign Systems & Contributors <sovereign@aien.dev>"]
description = "Sovereign native ABI for LLM inference backends"
license = "Apache-2.0 WITH LLVM-exception"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["sync", "rt", "macros"] }
