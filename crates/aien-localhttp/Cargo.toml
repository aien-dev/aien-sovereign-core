[package]
name = "aien-localhttp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Small native HTTP/1.1 client for plain http to local services. Refuses https; carries no crypto."

[features]
# Raw HTTP/1.1 test server for dependents' tests. Enable only from dev-dependencies.
test-server = []

[dependencies]
serde = "1.0"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.37", features = ["net", "io-util", "time", "rt"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "sync"] }
