[package]
name = "spark-inquisitor"
version = "0.2.0"
edition = "2021"
authors = ["AIEN Sovereign Systems & Contributors <sovereign@aien.dev>"]
description = "Autonomous Sovereign Inquisitor & Pull Request Alignment Gatekeeper"
license = "Apache-2.0 WITH LLVM-exception"

[[bin]]
name = "spark-inquisitor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
colored = "2.1"
