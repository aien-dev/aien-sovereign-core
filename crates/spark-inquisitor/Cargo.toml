[package]
name = "spark-inquisitor"
version = "0.2.0"
edition = "2021"
authors = ["Drake Stapleton <drake.aien@proton.me>"]
description = "Autonomous Sovereign Inquisitor & Pull Request Alignment Gatekeeper"
license.workspace = true

[[bin]]
name = "spark-inquisitor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spark-crumbs = { git = "https://github.com/aien-dev/spark-crumbs" }
chrono = { version = "0.4", features = ["serde"] }
crumb-spec = { git = "https://github.com/aien-dev/crumb-spec" }
regex = "1.13"
colored = "2.2"
