[package]
name = "aien-drive"
description = "AIEN autonomous API driver: loops a local chat model with tool dispatch (Rust replacement for the removed scripts/aien_drive.py, issue #179)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# Plain http:// to loopback only, over std::net. No Python, no TLS, no async.
[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
serde_json = "1"

[lib]
name = "aien_drive"
path = "src/lib.rs"

[[bin]]
name = "aien-drive"
path = "src/main.rs"
