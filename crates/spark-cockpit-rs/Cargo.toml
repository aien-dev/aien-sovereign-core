[package]
authors = ["Drake Stapleton <drake.aien@proton.me>"]
license.workspace = true
name = "spark-cockpit-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["ws"] }
chrono = "0.4.45"
form_urlencoded = "1.2"
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spark-adapters = { path = "../spark-adapters" }
spark-hive = { path = "../spark-hive" }
portable-pty = "0.9.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
toml = "0.8"
uuid = { version = "1.8", features = ["v4"] }
