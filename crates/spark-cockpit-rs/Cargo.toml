[package]
authors = ["Drake Stapleton <drake.aien@proton.me>"]
license = "Apache-2.0"
name = "spark-cockpit-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
chrono = "0.4.45"
form_urlencoded = "1.2"
futures-util = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
spark-hive = { path = "../spark-hive" }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
toml = "0.8"

