[package]
name = "aien-proof"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared test board for the hive: fingerprinted stamps, in-flight join, CPU/GPU/memory gates, crumb-compatible hash-chained ledger"

[dependencies]
blake3 = "1.8"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "aien-proof"
path = "src/main.rs"

[lib]
name = "aien_proof"
path = "src/lib.rs"
