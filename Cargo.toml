[workspace]
resolver = "2"
members = [
    "crates/aien-cli",
    "crates/spark-cockpit-rs",
    "crates/cortex-rs",
    "crates/spark-hive",
    "crates/spark-supervisor",
    "crates/spark-discord-hub",
    "crates/spark-debugger",
    "crates/spark-harness",
    "crates/spark-dream",
    "crates/spark-adapters",
    "crates/spark-crumbs",
    "crates/spark-inquisitor",
    "crates/spark-max-cabi",
    "crates/spark-max-rs",
    "crates/cortex-encoder-rs",
    "crates/spark-mail-rs",
    "crates/spark-harvester",
    "crates/spark-aegis",
    "crates/aien-inference-abi",
    "crates/aien-kv-cache",
    "crates/aien-scheduler",
    "crates/aien-security",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["AIEN Sovereign Systems & Contributors <sovereign@aien.dev>"]
repository = "https://github.com/aien-dev/aien-sovereign-core"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
